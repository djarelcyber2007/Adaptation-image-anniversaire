<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Affiche Anniversaire – Global Génie Électrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;800&display=swap" rel="stylesheet">
<style>
  :root{--rouge:#d41a00;--vert:#00ca98;--texte:#1b1b1b;--fond:#f4f4f4}
  *{box-sizing:border-box}
  body{margin:0;font-family:Montserrat,Arial,sans-serif;background:var(--fond);color:var(--texte);
       display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-start;padding:24px}
  .apercu{flex:1 1 320px;max-width:560px}
  canvas{width:100%;height:auto;display:block;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.2);background:#fff}
  form{flex:1 1 280px;max-width:380px;background:#fff;border-radius:12px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  h1{font-size:1.15rem;margin:0 0 18px;color:var(--rouge)}
  label{display:block;font-weight:800;font-size:.85rem;margin:14px 0 6px}
  input[type=text],input[type=date]{width:100%;padding:11px 12px;border:1px solid #ccc;border-radius:8px;font:inherit}
  input[type=file]{width:100%;font:inherit;font-size:.85rem}
  input:focus{outline:2px solid var(--vert);border-color:var(--vert)}
  button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:8px;background:var(--vert);
         color:#fff;font:inherit;font-weight:800;font-size:1rem;cursor:pointer}
  button:hover{filter:brightness(.93)}
</style>
</head>
<body>
  <div class="apercu"><canvas id="affiche" width="2500" height="2800"></canvas></div>

  <form id="formulaire" onsubmit="return false">
    <h1>Personnalise ton affiche</h1>
    <label for="photo">Photo</label>
    <input type="file" id="photo" accept="image/*">
    <label for="nom">Nom et prénoms</label>
    <input type="text" id="nom" maxlength="40" placeholder="Nom et prénoms">
    <label for="date">Date</label>
    <input type="date" id="date">
    <button type="button" id="telecharger">Télécharger l’affiche</button>
  </form>

  ctx.save();
  ctx.beginPath(); ctx.rect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h); ctx.clip();
  ctx.fillStyle = "#e6e6e6"; ctx.fillRect(PHOTO.x,PHOTO.y,PHOTO.w,PHOTO.h);
  if(photo) recadrer(photo);
  ctx.restore();
  // 2) fond de l'affiche
  ctx.drawImage(fond,0,0);
  // 3) nom
  const nom = document.getElementById("nom").value.trim() || "Nom et prenoms";
  let taille = 100;
  ctx.textAlign = "center"; ctx.textBaseline = "alphabetic"; ctx.fillStyle = "#fff";
  ctx.font = "300 "+taille+"px Montserrat, Arial, sans-serif";
  const largeurMax = 1000;
  const l = ctx.measureText(nom).width;
  if(l > largeurMax){ taille = Math.floor(taille*largeurMax/l); ctx.font = "300 "+taille+"px Montserrat, Arial, sans-serif"; }
  ctx.fillText(nom, CENTRE_X, 1607);
  // 4) date : « Vendredi » en gras + « 03 / 12 / 2000 » en léger
  const v = document.getElementById("date").value;
  let jour = "Vendredi", reste = " 03 / 12 / 2000";
  if(v){
    const [a,m,j] = v.split("-").map(Number);
    const d = new Date(a,m-1,j);
    jour = d.toLocaleDateString("fr-FR",{weekday:"long"});
    jour = jour.charAt(0).toUpperCase()+jour.slice(1);
    reste = " "+String(j).padStart(2,"0")+" / "+String(m).padStart(2,"0")+" / "+a;
  }
  const t = 75;
  ctx.textAlign = "left"; ctx.fillStyle = VERT;
  ctx.font = "800 "+t+"px Montserrat, Arial, sans-serif"; const w1 = ctx.measureText(jour).width;
  ctx.font = "300 "+t+"px Montserrat, Arial, sans-serif"; const w2 = ctx.measureText(reste).width;
  const x0 = CENTRE_X-(w1+w2)/2;
  ctx.font = "800 "+t+"px Montserrat, Arial, sans-serif"; ctx.fillText(jour,x0,1766);
  ctx.font = "300 "+t+"px Montserrat, Arial, sans-serif"; ctx.fillText(reste,x0+w1,1766);
}

document.getElementById("photo").addEventListener("change", e=>{
  const f = e.target.files[0]; if(!f) return;
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = ()=>{ photo = img; dessiner(); URL.revokeObjectURL(url); };
  img.src = url;
});
document.getElementById("nom").addEventListener("input", dessiner);
document.getElementById("date").addEventListener("input", dessiner);

document.getElementById("telecharger").addEventListener("click", ()=>{
  dessiner();
  canvas.toBlob(blob=>{
    const nom = (document.getElementById("nom").value.trim() || "affiche").replace(/[^\w\-]+/g,"_");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "anniversaire_"+nom+".png";
    document.body.appendChild(a); a.click(); a.remove();
  },"image/png");
});

fond.onload = dessiner;
fond.src = FOND_SRC;
Promise.all([document.fonts.load("300 100px Montserrat"), document.fonts.load("800 100px Montserrat")])
  .then(dessiner).catch(()=>{});
</script>
